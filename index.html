<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Arab - római szám konverter</title>

    <link rel="stylesheet" href="https://code.jquery.com/qunit/qunit-2.24.1.css">
</head>
<body>

    <div id="qunit"></div>
    <div id="qunit-fixture"></div>

    <script src="https://code.jquery.com/qunit/qunit-2.24.1.js"></script>

    <script>
        function arabToRoman(number) {
            const romanNumbers = [
                { value: 10, symbol: "X" },
                { value: 5, symbol: "V" },
                { value: 1, symbol: "I" }
            ];

            let result = "";

            for (let i = 0; i < romanNumbers.length; i++) {
                while (number >= romanNumbers[i].value) {
                    result += romanNumbers[i].symbol;
                    number -= romanNumbers[i].value;
                }
            }

            return result;
        }

        QUnit.module("Arab - római szám konverter tesztelése");

        QUnit.test("1 átalakítása", function(assert) {
            assert.equal(arabToRoman(1), "I");
        });

        QUnit.test("Egyszerű számok átalakítása", function(assert) {
            assert.equal(arabToRoman(2), "II");
            assert.equal(arabToRoman(3), "III");
            assert.equal(arabToRoman(5), "V");
            assert.equal(arabToRoman(10), "X");
        });

        QUnit.test("Kivonásos római számok", function(assert) {
            assert.equal(arabToRoman(4), "IV");
            assert.equal(arabToRoman(9), "IX");
            assert.equal(arabToRoman(40), "XL");
            assert.equal(arabToRoman(90), "XC");
            assert.equal(arabToRoman(400), "CD");
            assert.equal(arabToRoman(900), "CM");
        });
    </script>

</body>
</html>
